[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citegraph"
version = "0.1.0"
description = "Graph learning and review routing for scientific citation networks"
requires-python = ">=3.11"
authors = [{name = "Jaber Mobarak"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "torch>=2.5,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx[socks]>=0.27,<1", "safetensors>=0.4,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
citegraph = "citegraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
citegraph = ["static/*"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
