name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev]'
      - run: python -m citegraph.cli prepare
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python scripts/check_release.py
      - run: pip wheel . --no-deps --wheel-dir /tmp/wheels
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t citegraph:test .
      - run: docker run -d --name citegraph -p 8000:8000 citegraph:test
      - run: |
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs citegraph
          exit 1
